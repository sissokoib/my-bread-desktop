name: Build macOS Desktop (.dmg)

on:
  # Déclenchement automatique à chaque git push sur sissoko/main ou création de tag/release
  push:
    branches:
      - sissoko
      - main
    tags:
      - 'v*'
  release:
    types: [published, created]
  # Permet aussi de lancer la compilation manuellement en 1 clic depuis l'onglet "Actions" sur GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Compiler My Bread pour macOS (Intel & Apple Silicon)
    runs-on: macos-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installer les dépendances
        run: npm install

      - name: Compiler l'application Angular et générer les installateurs macOS (.dmg / .zip)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run desktop:mac

      - name: Sauvegarder les fichiers .dmg dans les artefacts GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: My-Bread-macOS-Installers
          path: |
            dist_desktop/*.dmg
            dist_desktop/*.zip

      - name: Attacher les fichiers .dmg à la Release GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "My Bread $TAG" --notes "Version $TAG (Windows & macOS)"
          gh release upload "$TAG" dist_desktop/*.dmg dist_desktop/*.zip --clobber
